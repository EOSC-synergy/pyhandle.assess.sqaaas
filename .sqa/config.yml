      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/EUDAT-B2HANDLE/pyhandle:
      branch: master
      repo: https://github.com/EUDAT-B2HANDLE/pyhandle
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
